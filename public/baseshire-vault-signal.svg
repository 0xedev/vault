<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Baseshire vault signal plate</title>
  <desc id="desc">Editorial escrow rail visualization with custody plates, ledger rows, and royal blue trust routes.</desc>
